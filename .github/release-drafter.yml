# Configuration for Release Drafter: https://github.com/toolmantim/release-drafter
name-template: '$RESOLVED_VERSION 🌈'
tag-template: '$RESOLVED_VERSION'

# Emoji reference: https://gitmoji.carloscuesta.me/
categories:
  - type: "pre-exclude"
    when:
      labels: 
        - reverted
        - no-changelog
        - skip-changelog
        - invalid
  - type: "version-resolver"
    semver-increment: "major"
    when:
      labels: 
        - "major"
  - type: "version-resolver"
    semver-increment: "minor"
    when:
      labels:
        - 'minor'
        - 'feature'
        - 'enhancement'
  - type: "version-resolver"
    semver-increment: "patch"
    when:
      labels:
        - 'patch'
        - 'fix'
        - 'bugfix'
        - 'bug'
        - 'chore'
        - 'dependencies'
  - title: ":boom: Breaking changes"
    when:
      labels:
        - breaking
  - title: 🚨 Removed
    when:
      labels:
        - removed
  - title: ":tada: Major features and improvements"
    when:
      labels:
        - major-enhancement
        - major-rfe
  - title: 🐛 Major bug fixes
    when:
      labels:
        - major-bug
  - title: ⚠️ Deprecated
    when:
      labels:
        - deprecated
  - title: 🚀 New features and improvements
    when:
      labels:
        - enhancement
        - feature
        - rfe
  - title: 🐛 Bug Fixes
    when:
      labels:
        - bug
        - fix
        - bugfix
        - regression
  - title: ":construction_worker: Changes for plugin developers"
    when:
      labels:
        - developer
  - title: 📝 Documentation updates
    when:
      labels:
        - documentation
  - title: 👻 Maintenance
    when:
      labels:
        - chore
        - internal
  - title: 🚦 Tests
    when:
      labels:
        - test
        - tests
  - title: ✍ Other changes
  # Default label used by Dependabot
  - title: 📦 Dependency updates
    when:
      labels:
        - dependencies
    collapse-after: 15

template: |
  <!-- Optional: add a release summary here -->
  $CHANGES

replacers:
  - search: '/\[*JENKINS-(\d+)\]*\s*-*\s*/g'
    replace: '[JENKINS-$1](https://issues.jenkins-ci.org/browse/JENKINS-$1) - '
  - search: '/\[*HELPDESK-(\d+)\]*\s*-*\s*/g'
    replace: '[HELPDESK-$1](https://github.com/jenkins-infra/helpdesk/issues/$1) - '
  # TODO(oleg_nenashev): Find a better way to reference issues
  - search: '/\[*SECURITY-(\d+)\]*\s*-*\s*/g'
    replace: '[SECURITY-$1](https://jenkins.io/security/advisories/) - '
  - search: '/\[*JEP-(\d+)\]*\s*-*\s*/g'
    replace: '[JEP-$1](https://github.com/jenkinsci/jep/tree/master/jep/$1) - '
  - search: '/CVE-(\d{4})-(\d+)/g'
    replace: 'https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-$1-$2'
  - search: 'JFR'
    replace: 'Jenkinsfile Runner'
  - search: 'CWP'
    replace: 'Custom WAR Packager'
  - search: '@dependabot-preview'
    replace: '@dependabot'

autolabeler:
  - label: 'dependencies'
    title:
      - '/chore(deps)/i'
  - label: 'documentation'
    branch:
      - '/docs{0,1}\/.+/'
    title:
      - '/documentation/i'
      - '/docs/i'
  - label: 'bug'
    branch:
      - '/fix\/.+/'
    title:
      - '/fix/i'
  - label: 'chore'
    branch:
      - '/chore\/.+/'
    title:
      - '/chore/i'
  - label: 'enhancement'
    branch:
      - '/feature\/.+/'
    body:
      - '/JENKINS-[0-9]{1,4}/'
    title:
      - '/feat/i'
